name: Analyze winning patterns

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-winning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Analyze winning patterns
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run analyze:winning

      - name: Commit updated winning patterns
        run: |
          if git diff --quiet -- data/winning-patterns.json; then
            echo "No changes to data/winning-patterns.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/winning-patterns.json
          git commit -m "Update winning patterns data"
          git push
